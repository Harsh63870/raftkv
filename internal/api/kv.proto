syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/yourname/raftkv/internal/api;api";

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Cluster control.
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool found = 2;
  // Node that served the read. Reads are local, so this may lag the leader.
  string served_by = 3;
}

message SetRequest {
  string key = 1;
  string value = 2;
}

message SetResponse {
  // Set if the write was proxied to the leader by the contacted node.
  string forwarded_to = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  string forwarded_to = 1;
}

message JoinRequest {
  string node_id = 1;
  string raft_addr = 2;
  string grpc_addr = 3;
}

message JoinResponse {}

message SnapshotRequest {}

message SnapshotResponse {
  uint64 index = 1;
}

message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  string state = 2;
  string leader_id = 3;
  string leader_addr = 4;
  uint64 term = 5;
  uint64 applied_index = 6;
  uint64 last_index = 7;
  repeated Peer peers = 8;
  int32 keys = 9;
}

message Peer {
  string node_id = 1;
  string raft_addr = 2;
  string grpc_addr = 3;
  bool leader = 4;
}
